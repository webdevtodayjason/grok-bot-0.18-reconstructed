# The proxy's BOOTSTRAP settings (docs/PROXY.md, docs/GAP-ANALYSIS.md PROVIDERS-1).
#
# ---- WHAT THIS FILE IS, AS OF PROVIDERS-1 --------------------------------------------------------
# It used to be the model list. It is not any more. Providers, their keys, the pools those keys form
# and the plan models customers run on live in the proxy's own Postgres and are managed live from
# the Providers panel at api.titanium.bot/admin, through the control plane, with no restart. This
# file keeps only what has to be read at BOOT, before there is a database connection to read
# anything from.
#
# So: adding a provider, adding a second or third key to a plan, rolling a key, repointing an alias
# at a new vendor model and setting what a customer's Titan calls it are all things you do from that
# page or from `node cp/cli.mjs proxy ...`. None of them is an edit to this file, and none of them
# is a restart. If you find yourself editing this file to add a model, stop: you are about to do by
# hand the thing PROVIDERS-1 exists to end.
#
# What a FRESH install seeds into that database is bootstrap.json, beside this file. It names the
# providers, the credential slots (by os.environ name, holding no value), the plan models with their
# full metadata and the fallback map. `node cp/cli.mjs proxy seed` reads it once: an install that
# already has rows is never re-seeded.
#
# ---- THE TWO STAGED FORMS ------------------------------------------------------------------------
# config.stage1.yaml beside this file is the SAME settings with model_list and router_settings.
# fallbacks still in it. It exists because the move is two restarts, not one:
#
#   restart one   install config.stage1.yaml as config.yaml. store_model_in_db goes on, the door
#                 list goes away, and the fleet KEEPS SERVING from the file across the restart.
#                 Then `proxy seed` writes the credentials, the deployments and the fallback map.
#                 For a short window each alias carries the file's deployments AND the database's.
#                 MEASURED on this Mac 2026-09-08 against litellm-database:v1.100.0: that is what
#                 happens and it is not a fault -- /model/info listed the file's rows with
#                 db_model false beside the database's with db_model true, on the same model_name,
#                 and requests were answered by both. They are the same keys and the same models,
#                 so traffic simply shuffles across a wider pool.
#   restart two   install THIS file. model_list and the fallback map are gone from the file and the
#                 proxy comes back serving from the rows seeded above.
#
# deploy/r750/proxy-install.sh installs both and picks which one is active with --stage.
#
# ---- ROLLING BACK --------------------------------------------------------------------------------
# Anything wrong in our own code is a revert, a sync and a control-plane rebuild, with NO proxy
# restart: the proxy keeps serving from its database rows either way. Going back to a
# file-configured proxy is a THIRD restart and is an incident, not a plan. If you have to: reinstall
# config.stage1.yaml, because it is the one that still carries model_list, and turn
# store_model_in_db off. The database rows then go inert rather than causing an outage.
#
# ---- THIS FILE STILL HOLDS NO KEY ----------------------------------------------------------------
# Every credential reference here is an os.environ/<NAME> and the values live in the proxy service's
# Coolify environment, put there by deploy/r750/proxy-coolify.mjs from ~/.api_keys by exact name.
# That is why this file is in git and why it can sit world-readable in the bind mount. From this
# wave those names are the FRESH-INSTALL bootstrap only: a live key is added, rolled and removed
# through the panel, and never by editing an environment field.
#
# It is copied to /data/titanbot-proxy/config/config.yaml by deploy/r750/proxy-install.sh, which is
# a DIRECTORY bind: a bind to this file alone would become a Coolify LocalFileVolume and one Save in
# the Storages UI would write Coolify's stale copy back over it.

litellm_settings:
  # A provider that accepts a request and then holds it open is a customer watching a spinner. Sixty
  # seconds is longer than any answer this fleet waits for and shorter than a browser's own patience.
  request_timeout: 60

router_settings:
  # One request goes to one of the pooled deployments at random. Not latency-based: two keys on one
  # provider are the same endpoint and the same model, so there is no latency to route on, and a
  # strategy that keeps state is a strategy that can be wrong after a restart.
  routing_strategy: simple-shuffle
  # A failed call is retried on ANOTHER deployment of the same model_name before the customer sees
  # an error, which is the whole point of holding two subscriptions.
  num_retries: 2
  # Three failures take a deployment out for thirty seconds. These are Router constructor
  # parameters, so they belong here and NOT under litellm_settings: LiteLLM does not reject an
  # unknown litellm_settings key, it ignores it, and a pool that silently never cools down is
  # exactly the class of invisible failure this wave is written against.
  allowed_fails: 3
  cooldown_time: 30
  # NO fallbacks KEY. The vision fallback (a request the flagship refuses because it carries an
  # image, code 1210) now lives in the database and is managed through POST /fallback, so the panel
  # can require one when a plan model is saved.
  #
  # MEASURED on this Mac 2026-09-08 against litellm-database:v1.100.0, and the body shape matters
  # because the obvious one is refused:
  #   POST /fallback {"model":"plan-x","fallback_models":["plan-x-vision"]}   200
  #   POST /fallback {"fallbacks":[{"plan-x":["plan-x-vision"]}]}             422 field required
  #   the same pair router_settings.fallbacks already declares                200 "created
  #     successfully" -- it is NOT refused, which is what lets stage one seed the map before this
  #     file stops declaring it (measured against the shipped config.stage1.yaml itself)
  #   a model given itself                                                    400 "cannot be its
  #     own fallback"
  #   a fallback naming a model_name the proxy does not currently serve       400 "Invalid fallback
  #     models: [...]" with the available list. So the vision DEPLOYMENT has to exist before the
  #     pair can be registered, and `proxy seed` writes deployments first and the map second.
  #   GET /fallback                                                           405; the read is
  #     GET /fallback/{model_name}, 404 "No general fallbacks configured for model 'x'" when unset.
  #
  # AND THE ONE THAT DECIDES THE SHIP ORDER, re-measured 2026-09-08 on this Mac against a container
  # booted on the shipped config.stage1.yaml, whose router_settings.fallbacks declares
  # plan-zai -> plan-zai-vision:
  #
  #   GET /fallback/plan-zai, BEFORE anything was posted   200
  #     {"model":"plan-zai","fallback_models":["plan-zai-vision"],"fallback_type":"general"}
  #
  # So the read answers out of the router's CURRENT map, and during stage one that map is the FILE's.
  # An earlier note here said it answered 404 until a POST wrote it; that is wrong and the correction
  # matters, because it inverts what a green read proves. A 200 during stage one does NOT mean the
  # database row exists -- it means SOMETHING declares the pair, and while the file still does, the
  # two are indistinguishable over HTTP. If the seed silently wrote nothing, every check during stage
  # one still passes and the map disappears at restart two, which is every screenshot-carrying turn
  # failing on the demo box with nothing in the ship log to explain it.
  #
  # What the row really is, measured by reading the database rather than the API: POST /fallback
  # writes the WHOLE router_settings blob to LiteLLM_Config where param_name = 'router_settings',
  # fallbacks included. That is the thing `proxy seed` has to confirm, and it is why the seed is
  # verified against the database and not against a 200 from this route.
  #
  # After restart two the database map is the only one there is, which is why the FIRST assertion
  # after that restart is GET /fallback/plan-zai answering plan-zai-vision, followed by a real
  # screenshot-carrying turn on the demo box. That assertion IS meaningful, because by then the file
  # declares nothing and only a database row can answer it.
  #
  # The control plane reconciles the map on its own boot, so a restart that comes back with an empty
  # map repairs itself rather than leaving every screenshot-carrying turn failing.

general_settings:
  # ---- THE ONE LINE THIS WHOLE WAVE TURNS ON ---------------------------------------------------
  # With this true, /model/new, /model/update, /credentials and /fallback write to Postgres and the
  # proxy serves what is there. MEASURED on this Mac 2026-09-08: this file's `true` beats
  # STORE_MODEL_IN_DB=False in the container's environment -- POST /model/new answered 200, the row
  # came back from /model/info with db_model true, and it served a request, with the environment
  # still saying False. The compose sets it to True as well, so the two agree and nobody has to
  # remember which one wins.
  store_model_in_db: true
  # How often a worker re-reads the database's config. Pinned explicitly rather than left to the
  # default because it is the number a SECOND worker would converge on. Our deploy runs
  # --num_workers 1 (deploy/coolify/proxy.compose.yml pins it), so nothing in the design depends on
  # this poll: MEASURED on this Mac 2026-09-08 over five cycles, a deployment added with POST
  # /model/new was serving 6 to 14 ms after the add answered (mean 8), and a deleted one stopped
  # being served 12 to 15 ms after. That is what "the next request" in the panel's copy means, and it
  # rests on the one worker. The providers leg of scripts/verify-proxy.mjs asserts the worker count
  # before it claims that number.
  #
  # MEASURE IT AGAINST A REACHABLE UPSTREAM OR THE NUMBER IS NOT THE NUMBER. The first cut of this
  # measurement pointed the new deployment at a dead port and read 5130 ms, which was not the router
  # taking 5 s to see the deployment -- it was the first request's own connect timeout. The
  # deployment was visible immediately; the clock was measuring the wrong thing.
  proxy_config_reload_interval_seconds: 10
  database_connection_pool_limit: 10
  # How long spend rows are batched before they are written. LiteLLM's production page suggests 60.
  # Ten, because the admin console's Spend panel and scripts/verify-proxy.mjs both read this number
  # back, and a gate that has to wait a minute to see a dollar is a gate nobody runs.
  proxy_batch_write_at: 10
  # How long a virtual key's authorisation is cached. Set EXPLICITLY at 30 rather than left at the
  # default 60, because "revocation takes effect within a minute" is otherwise satisfied by luck.
  # This is the number scripts/verify-proxy.mjs waits out when it measures a revocation, and it is
  # also the window a key roll has to be quiet across.
  user_api_key_cache_ttl: 30
  # Off. A background health check calls every provider on a timer, which spends the operator's
  # subscription to answer a question nobody asked and can trip a rate limit on its own. The panel's
  # per-model health comes from an operator-triggered GET /health?model=<name>, read back out of
  # GET /health/latest.
  background_health_checks: false

  # ---- disable_error_logs IS DELIBERATELY NOT SET, AND HERE IS WHY -------------------------------
  # The wave's design asked for `disable_error_logs: true`, reasoning that this Postgres now holds
  # every provider key. MEASURED on this Mac 2026-09-08 by reading the image we run: the flag is
  # consulted in exactly one place, _should_track_errors_in_db() in
  # litellm/proxy/hooks/proxy_track_cost_callback.py, and returning False there stops a FAILED
  # request being written to the spend log at all. Turning it on would therefore mean the `status`
  # column can never carry `failure`, and "zero failed requests during the key roll" -- the
  # acceptance measurement this whole wave is judged on -- would be true because nothing could ever
  # be written, not because nothing failed. A gate that cannot fail is not a gate. The credential
  # argument does not survive contact either: an error row carries request metadata, never a
  # provider key, and the keys in that database are encrypted under PROXY_SALT_KEY whatever this
  # flag says. So it stays off, and the failure rows stay readable.

  # ---- WHERE THE PASS-THROUGH BLOCK LIVES IS THE WHOLE FEATURE ---------------------------------
  # `pass_through_endpoints` is read from general_settings and NOWHERE ELSE. MEASURED ON THE R750
  # 2026-09-08 with the identical two entries at the TOP LEVEL of this file: the proxy started
  # clean, logged nothing, listed no /tinyfish path in its own openapi.json, and answered every
  # call to one with `404 {"detail":"Not Found"}`. It looked configured and was absent.
  # proxy_server.py in the image we run (v1.100.0) has exactly one line that registers these:
  #   if general_settings.get("pass_through_endpoints", None) is not None:
  # An unknown key at the top level of a LiteLLM config is not an error, it is silence. So the
  # indentation below is load bearing, and scripts/verify-proxy.mjs asks the PROXY whether the
  # route exists rather than trusting this file -- a key in the wrong place has to fail a gate.
  #
  # `mcp_servers` is the opposite and stays where it is: proxy_server.py reads that one with
  # config.get("mcp_servers"), at the top level. The two are not interchangeable.
  #
  # These two stay in the FILE rather than moving to the database with everything else, and that is
  # a decision rather than an oversight. MEASURED on this Mac 2026-09-08: GET
  # /config/pass_through_endpoint returns every endpoint's headers UNMASKED, and for an entry
  # declared in THIS FILE it returns the os.environ reference already RESOLVED -- the operator's
  # real key, in the response body, to anyone who can call that route. /credentials masks
  # (`sk****AA`); this does not. So a pass-through's key is kept where the file's os.environ
  # indirection holds it, the panel never renders these headers, and the control plane never puts a
  # cleartext key through this route.
  pass_through_endpoints:
    - path: /tinyfish/fetch
      target: https://api.fetch.tinyfish.ai
      headers:
        x-api-key: os.environ/PROXY_TINYFISH_KEY_1
        content-type: application/json
      # Metering. A pass_through call is not a token call, so there is nothing to price from a usage
      # block; a flat per-request cost is what puts it on the same spend ledger as everything else and
      # therefore into the admin console's per-client number. TinyFish's own fetch and search are free
      # on this plan, so the figure is deliberately small and exists to make the call COUNTABLE.
      cost_per_request: 0.0001
    - path: /tinyfish/search
      target: https://api.search.tinyfish.ai
      headers:
        x-api-key: os.environ/PROXY_TINYFISH_KEY_1
        content-type: application/json
      cost_per_request: 0.0001

    # ---- RESERVED for PROXY-3, the second TinyFish subscription --------------------------------
    # A pass-through cannot pool two keys the way a model_name pools two deployments, so a second
    # TinyFish subscription is a second PAIR of paths and the control plane decides which pair a
    # tenant is given at mint. The two paths are named here so the shape is decided now and nobody
    # invents a third one later.
    #
    # They are COMMENTED rather than shipped empty, and that is measured too: on this Mac
    # 2026-09-08 a pass-through whose header is `os.environ/<a name nothing sets>` forwards the
    # LITERAL STRING "os.environ/<name>" to the upstream as the key. Shipped live with no key set,
    # these would be two doors to TinyFish carrying a header that is not a credential -- an
    # unauthenticated request wearing a costume. PROXY-7 still owns getting the key into
    # ~/.api_keys as TINYFISH_API_KEY_2; uncomment both blocks in the same edit.
    #
    # A second pair can also be added live, WITHOUT touching this file, and that is measured: POST
    # /config/pass_through_endpoint with include_subpath true answered 200 and the new path served
    # its first request with no restart, and the header is resolved from os.environ at REQUEST time,
    # so a live-added pass-through can carry an os.environ reference and hold no cleartext key.
    # Whichever way it is added, the environment name has to exist on the service first.
    #
    # THREE SHARP EDGES ON THE LIVE ROUTE, all measured here 2026-09-08 against v1.100.0, because
    # each one is a way for the panel to report a change it did not make:
    #   1. A POST for a path that ALREADY EXISTS does not replace it. It APPENDS a second row, the
    #      FIRST one keeps serving, and both rows stay in LiteLLM_Config.general_settings for good.
    #      Re-registering a catalog path on every Refresh would grow that row without bound and
    #      keep reading the target it was first given.
    #   2. DELETE ?endpoint_id=<the path> answers 400 and removes NOTHING; the delete wants the row
    #      id the POST answered with, and with that it answers 200 and the route then 404s. A
    #      caller that passes the path and does not check the status leaves the endpoint serving
    #      while believing it is gone -- which is what our own gate's cleanup used to do.
    #   3. So an EDIT is delete-by-row-id then register, in that order, and the row id has to be
    #      kept somewhere. It is not derivable from the path.
    #
    # Only LIVE-registered entries live in the database. The two declared below are read from this
    # file at boot every time and are not written to LiteLLM_Config at all, which is why the
    # database's general_settings row holds pass_through_endpoints and nothing else -- it does not
    # shadow store_model_in_db, the cache ttl or the batch window. Measured by reading the row.
    #
    # - path: /tinyfish/fetch-2
    #   target: https://api.fetch.tinyfish.ai
    #   headers:
    #     x-api-key: os.environ/PROXY_TINYFISH_KEY_2
    #     content-type: application/json
    #   cost_per_request: 0.0001
    # - path: /tinyfish/search-2
    #   target: https://api.search.tinyfish.ai
    #   headers:
    #     x-api-key: os.environ/PROXY_TINYFISH_KEY_2
    #     content-type: application/json
    #   cost_per_request: 0.0001

  # ---- THE DOOR LIST IS GONE, AND THIS IS WHAT REPLACED IT --------------------------------------
  # There used to be a `general_settings.allowed_routes` here: every route the proxy served, and
  # nothing else. It is deleted, deliberately, and this paragraph is what it left behind.
  #
  # What it did: a route not on the list answered 403 to every caller, which closed GET /health.
  # That mattered -- MEASURED ON THE R750 2026-09-08, one tenant-triggered /health sweep put three
  # rows in /spend/logs under the alias `litellm-internal-health-check`, spend $0.000043, charged to
  # the operator, because /health makes a live call to every provider deployment on the operator's
  # own subscriptions.
  #
  # Why it cannot be the boundary for a database-backed panel, in three parts, all measured:
  #   1. It is an EXACT STRING MATCH with no wildcards, so it cannot express a path-parameter route.
  #      Two of the panel's central mechanisms are exactly that: PATCH /credentials/{name}, which is
  #      the zero-gap key roll, and PATCH /model/{id}/update, which is the label edit.
  #   2. It is checked in pre_db_read_auth_checks, BEFORE the key is looked up, so it refuses the
  #      MASTER key too. Growing it to fit the panel would open every one of those routes to every
  #      box on the bridge at the same time.
  #   3. It is ONE GLOBAL LIST and cannot tell a tenant from the operator. That is precisely why
  #      PROXY-8 was open: a virtual key could read another tenant's key record through /key/info.
  #      MEASURED again on this Mac 2026-09-08 with no list at all: a default-minted virtual key
  #      answers 200 to GET /key/info and GET /model/info. Reading was always the hole.
  #
  # So the boundary moved to the KEY. MEASURED on this Mac 2026-09-08 against v1.100.0: a virtual
  # key minted with allowed_routes ["/v1/chat/completions","/chat/completions","/v1/models",
  # "/models"] answers 403 `Virtual key is not allowed to call this route. Only allowed to call
  # routes: [...]. Tried to call route: /key/info` on /key/info, /model/info, /model_group/info and
  # /health, while POST /v1/chat/completions and GET /v1/models still answer 200 and the master key
  # reading the same records is unaffected. POST /key/update accepts allowed_routes on a key that
  # ALREADY EXISTS and it bites within the authorisation cache window, so every key already in the
  # field is closed by a sweep that writes nothing into a box.
  #
  # THE ORDER IS LOAD BEARING. The per-key backfill over every key in the field runs BEFORE this
  # list is removed, never after, or there is a window where the whole admin surface is open to
  # every box on the bridge. deploy/r750/proxy-install.sh prints that order and docs/PROXY.md
  # states it.
  #
  # Under the per-key list there is a second layer that needs no configuration at all, also measured
  # here: a default-minted virtual key is refused POST /model/new with 403 `Your role=internal_user`
  # and POST /credentials with 401 `Only proxy admin can be used to ...`. Model management was never
  # open to a tenant; what was open was READING.

# ---- TinyFish, through the same door -------------------------------------------------------------
# The connector preset and the web-fetch/search backup route (source/host/extensions/inference/
# web-tools.ts and tinyfish-route.ts, CURSOR-1) keep working when they are pointed here, and the
# operator's TinyFish key stops living inside every box's connector-env-secrets.json.
#
# auth_type is bearer_token, NOT api_key. LiteLLM's api_key mode sends X-API-Key, and
# agent.tinyfish.ai refuses that header; the two REST endpoints above want x-api-key and get it from
# a header line instead of from the auth mode.
#
# The pass_through blocks carry no `auth` key on purpose, which leaves LiteLLM's default: a virtual
# key is required. Without one of ours in front, these would be an unauthenticated door to the
# operator's TinyFish account from anywhere on the bridge.
mcp_servers:
  tinyfish:
    url: https://agent.tinyfish.ai/mcp
    transport: http
    auth_type: bearer_token
    authentication_token: os.environ/PROXY_TINYFISH_KEY_1
    description: "TinyFish browser automation, billed to the operator's pooled subscription"

# ---- reserved for CLOUD-BROWSER-1 ----------------------------------------------------------------
# Cloud browsers ride this proxy rather than getting a door of their own: same virtual key, same
# meter, same revocation. Left commented so the shape is decided now and the credential is not.
# docs/PROXY.md has the section stub. It goes UNDER general_settings, beside the TinyFish entries.
# There is no allowed_routes line to add it to any more, which is one thing fewer to forget.
#
#  - path: /browser/
#    target: https://api.browserbase.com
#    headers:
#      x-bb-api-key: os.environ/PROXY_BROWSER_KEY
#    cost_per_request: 0.01

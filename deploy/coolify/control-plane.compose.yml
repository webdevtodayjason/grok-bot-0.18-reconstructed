# The control plane as a Coolify resource: one service, one bind mount, no port.
#
# This is the thing that knows who the customers are. It holds the account list, the scrypt
# password hashes, the session secret every tenant relay trusts, and the Coolify api key that can
# create and delete services on this server. Nothing else in this repo holds all four, so the whole
# shape of this file is about keeping that set small and reachable from one place only.
#
# It is deployed ONCE, next to the tenants it creates, in the same Coolify project (Titanium
# Computing) and environment (production) as console.titanium.bot. Paste it into New Resource ->
# Docker Compose Empty, set the six environment fields, set Domains on titanbot-cp to
# https://api.titanium.bot:7790, deploy. docs/TENANCY.md walks the whole first-run flow with the
# adopt and the first account.
#
# The same two Coolify rewrites that shape docker-compose.yml in this directory shape this file,
# and the reasoning there is not repeated here. In short:
#
#   no named volumes    Coolify renames every named volume to "{service-uuid}_{slug}" and creates
#                       it fresh and empty, so the store would come back empty on a redeploy with
#                       every account in it gone. The one mount below is a host PATH.
#   no ports            Nothing is published on a server interface. Coolify's Traefik reaches this
#                       container on the stack's own network from the Domains field, and the :7790
#                       in that field is the CONTAINER port, not a published one.
#   no networks         Coolify makes the network and attaches its proxy. A second network makes
#                       Traefik pick an address non-deterministically.
#   no traefik labels   Coolify writes the router, the certificate resolver and the redirect from
#                       the Domains field.
#   no container_name   Coolify overwrites it with "<service>-<resource uuid>". The role label
#                       below is how anything finds this container.
#
# And one rewrite that matters here in particular: a bind mount becomes a Coolify storage record,
# and the parser assumes a short-syntax bind is a DIRECTORY. /data/titanbot is a directory, so the
# assumption is harmless (saving the record runs mkdir -p on a directory that already exists). Do
# not add a bind to a single FILE here, ever: for a file that same code path reads the file into
# Coolify's database, and the file this service owns is the one with the password hashes in it.
#
# The image is built ONCE on the server, by hand, from the repo tree that sync.sh puts there:
#
#   docker build -t titanbot-cp:local -f /home/sem/titanbot/cp/Dockerfile /home/sem/titanbot
#
# `pull_policy: never` is what keeps Coolify's pull step from going looking for that tag in a
# registry it does not exist in.

services:
  titanbot-cp:
    image: titanbot-cp:local
    pull_policy: never
    restart: unless-stopped
    # Everything that has to find this container finds it by this label, for the same reason the
    # box and the relay do: Coolify renames the container and the name in a script goes stale.
    labels:
      com.titanbot.role: control-plane
    environment:
      # ---- the service itself ------------------------------------------------------------------
      CP_PORT: "7790"
      # The sqlite file lives here. It is UNDER the tenant root on purpose, so one bind mount and
      # one backup cover both, and the name cannot ever collide with a tenant: a slug is 3 to 32
      # characters of [a-z0-9-], so no slug can begin with an underscore.
      CP_DATA_DIR: /data/titanbot/_control-plane
      # The host directory that holds one directory per tenant, bind-mounted below. Each tenant
      # gets profile/, credential/, state/ and volumes/{workspace,data,store,chrome} under here.
      CP_TENANT_ROOT: /data/titanbot
      # The shared release files on the SERVER: runtime, deploy and ui. This service does not open
      # them, it writes them into each tenant's rendered compose as host paths, so there is nothing
      # to mount. If a later step ever needs to read them, mount them read-only rather than
      # widening this one.
      CP_RELEASE_ROOT: /home/sem/titanbot
      # Every tenant is https://<slug>.titanium.bot. The proxied wildcard *.titanium.bot already
      # points at this server, so a new tenant needs no DNS work at all.
      CP_BASE_DOMAIN: titanium.bot
      CP_PUBLIC_URL: https://api.titanium.bot
      COOLIFY_ENVIRONMENT_NAME: production

      # ---- the four secrets and the two uuids ---------------------------------------------------
      # Plain ${VAR}, deliberately not ${VAR:?} and not ${VAR:-}. Coolify builds an environment
      # field's NAME from everything between the braces, so ${CP_SESSION_SECRET:?} produces a field
      # literally named "CP_SESSION_SECRET:?", which is not a legal shell name: the line is dropped
      # and the deploy fails on a required variable that no field in the UI can set. This is the
      # same trap docker-compose.yml documents at TITANBOT_GATEWAY_TOKEN and TITAN_JOB_TOKEN.
      # cp/server.mjs refuses to start on a missing or short secret instead, which fails in the
      # same direction with a message that says what to do.
      #
      # The signing key for every session token, shared with every tenant relay so the relay can
      # verify a session it did not mint. 32 bytes or more. Generate it once:
      #   node -e "console.log(require('node:crypto').randomBytes(32).toString('hex'))"
      # Rotating it signs every customer out of every tenant at once, and every tenant relay has to
      # be given the new value in the same pass.
      CP_SESSION_SECRET: ${CP_SESSION_SECRET}
      # The bearer for the admin routes: adding accounts, adding tenants, adopting, stop and start.
      # It is not a customer credential and it never leaves the operator's hands.
      CP_ADMIN_TOKEN: ${CP_ADMIN_TOKEN}
      # Coolify's own api, which this service calls to create, start, stop and delete a tenant's
      # service. The key is the one from Keys & Tokens; it can create and delete resources on this
      # server, so it lives here and in Coolify's own store and nowhere else.
      COOLIFY_URL: ${COOLIFY_URL}
      COOLIFY_API_KEY: ${COOLIFY_API_KEY}
      # The project and server every tenant service is created in. Both are on the resource page of
      # console.titanium.bot, or from GET /projects and GET /servers.
      COOLIFY_PROJECT_UUID: ${COOLIFY_PROJECT_UUID}
      COOLIFY_SERVER_UUID: ${COOLIFY_SERVER_UUID}
    volumes:
      # The tenant root and the store, in one bind. Owned by uid 1000 on the host, which is `sem`,
      # which is the uid this image runs as (cp/Dockerfile says why). Once, before the first
      # deploy:
      #
      #   sudo install -d -o 1000 -g 1000 -m 0750 /data/titanbot
      #
      # /data is this host's docker data-root and the disk with room on it, which is why the
      # tenants live there rather than under /home/sem.
      - /data/titanbot:/data/titanbot
    # No docker socket, on purpose, and this is the difference between this service and the relay.
    # The relay needs one because it reaches into the box with `docker exec`. This service reaches
    # containers only through Coolify's api, which is an http call with a bearer. A socket here
    # would be root on the host next to the Coolify api key, for nothing.

# No top-level volumes key, no networks key, no ports. See the header.

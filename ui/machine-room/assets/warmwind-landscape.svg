  <path d="M0 710l175-147 99 80 127-115 116 105 93-71 130 127 122-110 113 86 129-121 104 116 117-96 175 119v210H0z" fill="url(#mid)" opacity=".92"/>
  <path d="M518 679c206-4 322 31 470 44 203 18 363-36 612-20v297H443c30-85 34-201 75-321z" fill="url(#water)"/>
  <path d="M0 738l152-53 126 51 108-80 111 55 115-34 55 102 102 63 72 158H0z" fill="url(#near)"/>
  <path d="M1600 658l-113-52-121 48-103-78-107 98-101 14-97 90-85 222h727z" fill="url(#near)"/>


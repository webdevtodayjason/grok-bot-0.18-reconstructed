<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Warm mountain valley at dusk</title>
  <desc id="desc">An abstract atmospheric landscape in warm amber and cool slate tones, designed as a quiet backdrop for the Machine Room interface.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33454f"/>
      <stop offset=".36" stop-color="#657279"/>
      <stop offset=".64" stop-color="#b4936d"/>
      <stop offset="1" stop-color="#28383e"/>
    </linearGradient>
    <radialGradient id="sun" cx="28%" cy="35%" r="45%">
      <stop offset="0" stop-color="#fff4d6" stop-opacity=".92"/>
      <stop offset=".17" stop-color="#f1c98b" stop-opacity=".58"/>
      <stop offset=".48" stop-color="#c69563" stop-opacity=".15"/>
      <stop offset="1" stop-color="#94785f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#718087"/>
      <stop offset="1" stop-color="#3c5159"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c5d61"/>
      <stop offset="1" stop-color="#1f3238"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3b3d"/>
      <stop offset="1" stop-color="#101b1f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2=".7">
      <stop offset="0" stop-color="#806d58" stop-opacity=".62"/>
      <stop offset=".42" stop-color="#334f57" stop-opacity=".88"/>
      <stop offset="1" stop-color="#1e343c"/>
    </linearGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>

  <g opacity=".42" filter="url(#blur24)" fill="#fff1d5">
    <ellipse cx="430" cy="272" rx="310" ry="72"/>
    <ellipse cx="260" cy="345" rx="270" ry="54"/>
    <ellipse cx="752" cy="218" rx="275" ry="47"/>

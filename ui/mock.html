<!doctype html>
<meta charset="utf-8">
<title>Machine Room — design mock</title>
<!--
  STATIC DESIGN MOCK. No gateway, no SSE, no live data: every string below is hardcoded so the
  design can be judged without a renderer fighting back. Once the look is signed off, this gets
  ported onto ui/index.html against real state. Open it straight off disk (file://).

  The one structural idea: this is ONE canvas, not a grid of panels. The canvas is the worker's
  computer. Small glass things float at its edges; the middle stays open for whatever the worker
  is actually doing. Hiding the chat un-dims the computer -- the desktop was never a thumbnail.
-->
<style>
:root {
  color-scheme: dark;

  /* Ink ramp -- everything on the canvas is white at some opacity, because the ground is a photo. */
  --ink:    rgba(255,255,255,.97);
  --ink-2:  rgba(255,255,255,.78);
  --ink-3:  rgba(255,255,255,.55);
  --ink-4:  rgba(255,255,255,.36);

  /* Two glasses, and only two. Dark for things that must stay readable over a bright desktop,
     light for things the eye should treat as lifted toward the viewer. */
  --glass-dark:  rgba(16,20,25,.52);
  --glass-light: rgba(255,255,255,.14);
  --edge:        rgba(255,255,255,.20);
  --edge-soft:   rgba(255,255,255,.10);

  /* One saturated colour in the entire product, spent on the single control that stops a
     running worker. Everything else earns attention through size and contrast instead. */
  --hot: #ff2d6f;
  --ok:  #57e08f;

  --shadow-lift: 0 18px 44px rgba(0,0,0,.34), 0 2px 6px rgba(0,0,0,.18);
  --shadow-soft: 0 8px 24px rgba(0,0,0,.22);

  --r-canvas: 22px;
  --r-card: 16px;
  --r-pill: 999px;

  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: 15px/1.5 var(--font);
  background: #e9eaec;                     /* the app's own ground, outside the canvas */
  color: #16181c;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------------------------------------------------------------- shell */

#app { height: 100%; display: grid; grid-template-rows: 34px minmax(0,1fr) 78px; padding: 6px 14px 0; }

#canvas {
  position: relative;
  border-radius: var(--r-canvas);
  overflow: hidden;
  box-shadow: var(--shadow-lift);
  isolation: isolate;
}

/* The computer. In the real build this is the live desktop iframe; here it is a painted stand-in
   so the mock can be opened off disk. Either way it is the ground everything else sits on. */
#wall {
  position: absolute; inset: 0;
  background: linear-gradient(
    #0f1a33 0%, #223a63 15%, #4a5c8c 32%, #8e7f9e 47%,
    #d8a184 60%, #f2c79b 68%, #cfd3cd 80%, #8ea3a4 92%, #5d7276 100%);
  transform: scale(1.04);
  transition: filter .62s cubic-bezier(.2,.7,.3,1), transform .62s cubic-bezier(.2,.7,.3,1);
}
/* Distant ranges: blurred ellipses, far ones lighter and bluer than near ones, which is the only
   trick atmospheric perspective needs. */
#wall::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(closest-side, #6a7ba8 0%, #6a7ba8 62%, transparent 100%) -6% 62%/62% 30% no-repeat,
    radial-gradient(closest-side, #7986ac 0%, #7986ac 60%, transparent 100%) 46% 59%/58% 26% no-repeat,
    radial-gradient(closest-side, #5f6f96 0%, #5f6f96 60%, transparent 100%) 96% 63%/54% 30% no-repeat,
    radial-gradient(closest-side, #3d4d66 0%, #3d4d66 66%, transparent 100%) 22% 78%/78% 34% no-repeat,
    radial-gradient(closest-side, #2b3a4d 0%, #2b3a4d 68%, transparent 100%) 86% 84%/72% 34% no-repeat;
  filter: blur(22px);
  opacity: .92;
}
/* The light source, and the haze it throws into the valley. */
#wall::after {
  content: ""; position: absolute; inset: -10%;
  background:
    radial-gradient(closest-side, rgba(255,226,186,.85), transparent) 62% 60%/34% 20% no-repeat,
    radial-gradient(closest-side, rgba(255,238,214,.42), transparent) 62% 62%/76% 34% no-repeat,
    radial-gradient(closest-side, rgba(226,236,240,.50), transparent) 28% 72%/62% 16% no-repeat;
  filter: blur(30px);
}
/* Chat up: the computer recedes. Chat hidden: it comes forward, sharp and clickable. */
#canvas[data-chat="on"] #wall { filter: blur(15px) saturate(.92) brightness(.78); }
#scrim {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background:
    linear-gradient(102deg, rgba(6,10,16,.60) 0%, rgba(6,10,16,.34) 40%, transparent 68%),
    radial-gradient(58% 46% at 50% 96%, rgba(6,10,16,.42), transparent);
  opacity: 0; transition: opacity .5s ease;
}
#canvas[data-chat="on"] #scrim { opacity: 1; }
#canvas[data-chat="off"] #wall { filter: none; transform: scale(1); }

/* ---------------------------------------------------------------- dock: connected apps */

#dock {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  background: rgba(255,255,255,.94);
  border-radius: 0 0 20px 20px;
  box-shadow: var(--shadow-soft);
  z-index: 5;
}
.app {
  width: 38px; height: 38px; border-radius: 11px;
  display: grid; place-items: center;
  font-size: 17px; font-weight: 700; color: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.22);
  cursor: pointer;
  transition: transform .2s cubic-bezier(.34,1.5,.5,1);
}
.app:hover { transform: translateY(-3px) scale(1.06); }
.app.add { background: #fff; color: #6b7075; border: 1px solid #dfe2e5; box-shadow: none; font-weight: 400; font-size: 21px; }
/* Signed-out apps read as absent, not broken: no red, just no colour. */
.app.off { filter: grayscale(1); opacity: .40; }

/* ---------------------------------------------------------------- left: windows open on the computer */

#windows {
  position: absolute; left: 16px; top: 56px; bottom: 62px;
  width: 168px; z-index: 4;
  display: flex; flex-direction: column; gap: 9px;
  overflow: hidden;
}
.win {
  border-radius: 11px; overflow: hidden; cursor: pointer;
  background: rgba(255,255,255,.20);
  border: 1px solid var(--edge-soft);
  box-shadow: var(--shadow-soft);
  flex: 0 0 auto;
  transition: transform .28s cubic-bezier(.34,1.4,.5,1), box-shadow .28s;
}
.win:hover { transform: translateX(5px) scale(1.02); box-shadow: var(--shadow-lift); }
.win .bar {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px; font-size: 11.5px; font-weight: 600; color: var(--ink);
  background: rgba(255,255,255,.16);
  border-bottom: 1px solid var(--edge-soft);
}
.win .bar i { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 auto; font-style: normal; }
.win .shot { height: 96px; background-size: cover; background-position: top left; }
.win.live { outline: 1.5px solid rgba(87,224,143,.75); outline-offset: -1.5px; }
.win.live .bar::after {
  content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
  margin-left: auto; box-shadow: 0 0 0 0 rgba(87,224,143,.5); animation: ping 2.4s infinite;
}
@keyframes ping { 70%, 100% { box-shadow: 0 0 0 7px rgba(87,224,143,0); } }

/* ---------------------------------------------------------------- centre: the open middle */

#middle {
  position: absolute; inset: 56px 268px 62px 200px;
  z-index: 3;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* -- the completed-workflow report ------------------------------------- */

#report { overflow: auto; padding-right: 8px; }
#report::-webkit-scrollbar { width: 0; }
.rep-h1 {
  font-size: 40px; font-weight: 600; letter-spacing: -.022em; color: var(--ink);
  text-shadow: 0 1px 22px rgba(0,0,0,.34);
  text-wrap: balance;
}
.rep-sub { margin-top: 10px; max-width: 58ch; font-size: 16px; color: var(--ink-2); text-shadow: 0 1px 14px rgba(0,0,0,.32); }
.stats { display: flex; gap: 14px; margin: 22px 0 26px; }
.stat {
  flex: 0 1 288px; padding: 20px 22px;
  background: var(--glass-light); border: 1px solid var(--edge-soft);
  border-radius: var(--r-card); backdrop-filter: blur(20px);
}
.stat b {
  display: block; font-size: 30px; font-weight: 600; letter-spacing: -.02em; color: var(--ink);
  font-variant-numeric: tabular-nums; line-height: 1.22;
}
.stat span { display: block; margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
.rep-h2 { margin: 0 0 12px; font-size: 21px; font-weight: 600; color: var(--ink); text-shadow: 0 1px 16px rgba(0,0,0,.3); }
.rep-list { list-style: none; display: flex; flex-direction: column; gap: 9px; max-width: 66ch; margin-bottom: 26px; }
.rep-list li {
  position: relative; padding-left: 18px; font-size: 15px; color: var(--ink-2);
  text-shadow: 0 1px 12px rgba(0,0,0,.3);
}
.rep-list li::before {
  content: ""; position: absolute; left: 2px; top: 9px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--ink-4);
}

/* -- the conversation --------------------------------------------------- */

#chat {
  margin-top: auto; width: 460px; align-self: center;
  display: flex; flex-direction: column; gap: 9px;
  /* Older turns fade upward instead of scrolling under a hard edge. */
  mask-image: linear-gradient(180deg, transparent, #000 76px);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 76px);
  padding-top: 40px;
}
.msg {
  max-width: 82%; padding: 11px 14px; border-radius: 14px;
  font-size: 14.5px; line-height: 1.48; color: var(--ink);
  border: 1px solid var(--edge-soft);
  backdrop-filter: blur(18px);
  box-shadow: 0 4px 18px rgba(0,0,0,.16);
}
/* Dark for the worker, light for you -- the direction of the conversation is a material, not a
   colour, so it still reads at a glance over any wallpaper. */
.msg.them { align-self: flex-start; background: var(--glass-dark); }
.msg.you  { align-self: flex-end;   background: rgba(255,255,255,.19); }
.msg .when { margin-top: 5px; font-size: 10.5px; color: var(--ink-4); text-align: right; font-variant-numeric: tabular-nums; }

/* Thinking is a line of text, not a card. It is the worker being quiet, not a system event. */
.thinking {
  align-self: center; display: flex; align-items: center; gap: 9px;
  margin-top: 18px; font-size: 14.5px; color: var(--ink-2); text-shadow: 0 1px 12px rgba(0,0,0,.35);
}
.dots { display: flex; gap: 3px; }
.dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); animation: blink 1.25s infinite; }
.dots i:nth-child(2) { animation-delay: .17s; }
.dots i:nth-child(3) { animation-delay: .34s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

/* -- what the worker is doing right now, shown big ----------------------- */

#doing {
  flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
}
.screen {
  width: 86%; height: 82%;
  border-radius: 13px; overflow: hidden;
  border: 1px solid var(--edge);
  box-shadow: 0 26px 70px rgba(0,0,0,.42);
  background: #fbfbfc;
  display: flex; flex-direction: column;
}
.screen .chrome {
  display: flex; align-items: center; gap: 7px; padding: 8px 11px;
  background: #eceef0; border-bottom: 1px solid #dcdfe2; flex: 0 0 auto;
}
.screen .chrome i { width: 10px; height: 10px; border-radius: 50%; background: #cdd2d6; }
.screen .chrome span { margin-left: 8px; font-size: 11.5px; color: #6a7075; }
.screen .body { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
.screen .row {
  height: 30px; border-radius: 5px; display: flex; align-items: center; gap: 14px; padding: 0 11px;
  font-size: 12px; color: #3c4247; border-bottom: 1px solid #eef0f2;
}
.screen .row.head { background: #f4f6f7; color: #767c82; font-weight: 600; font-size: 11px; letter-spacing: .03em; text-transform: uppercase; }
.screen .row b { width: 66px; font-weight: 500; font-variant-numeric: tabular-nums; }
.screen .row s { flex: 1; text-decoration: none; }
.screen .row u { width: 92px; text-decoration: none; color: #767c82; }
.screen .row i { width: 58px; font-style: normal; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #eaeef1; color: #5b6167; text-align: center; }
.screen .row.hit { background: rgba(255,45,111,.07); box-shadow: inset 0 0 0 1px rgba(255,45,111,.28); }

/* The cursor the worker is driving. This is the whole point of watching. */
.cursor {
  position: absolute; width: 15px; height: 21px; z-index: 6;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
  animation: drive 6s cubic-bezier(.5,.05,.35,1) infinite;
}
@keyframes drive {
  0%   { transform: translate(340px, 300px); }
  28%  { transform: translate(560px, 214px); }
  34%  { transform: translate(556px, 218px); }
  62%  { transform: translate(700px, 366px); }
  68%  { transform: translate(696px, 370px); }
  100% { transform: translate(340px, 300px); }
}

/* ---------------------------------------------------------------- right: schedule + the plan */

#side { position: absolute; right: 16px; top: 56px; width: 236px; z-index: 4; display: flex; flex-direction: column; gap: 11px; }

.card {
  background: var(--glass-dark); border: 1px solid var(--edge-soft);
  border-radius: var(--r-card); backdrop-filter: blur(22px);
  box-shadow: var(--shadow-soft); color: var(--ink);
}
.sched { padding: 16px 14px; text-align: center; }
.sched .icon {
  width: 30px; height: 30px; border-radius: 50%; margin: 0 auto 10px;
  display: grid; place-items: center; background: rgba(255,255,255,.14); font-size: 12px;
}
.sched b { display: block; font-size: 14px; font-weight: 500; }
.sched span { display: block; margin-top: 5px; font-size: 11.5px; line-height: 1.45; color: var(--ink-3); }

.plan .plan-h {
  padding: 8px 12px; font-size: 11.5px; color: var(--ink-3); text-align: center;
  background: rgba(255,255,255,.07); border-bottom: 1px solid var(--edge-soft);
  border-radius: var(--r-card) var(--r-card) 0 0;
}
.steps { list-style: none; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 13px; position: relative; }
/* One hairline rail behind the checks: the steps are a sequence, and the line says so. */
.steps::before { content: ""; position: absolute; left: 21px; top: 20px; bottom: 22px; width: 1px; background: var(--edge-soft); }
.step { display: flex; align-items: center; gap: 9px; font-size: 12.5px; position: relative; }
.step .mark {
  width: 19px; height: 19px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center;
  font-size: 10px; background: rgba(16,20,25,.9); border: 1.5px solid var(--ok); color: var(--ok);
}
.step.todo .mark { border-color: var(--ink-4); color: transparent; }
.step.now .mark  { border-color: var(--ink); color: var(--ink); animation: turn 1.1s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.step .label { flex: 1; color: var(--ink); }
.step.todo .label { color: var(--ink-3); }
.step .badge { width: 15px; height: 15px; border-radius: 4px; flex: 0 0 auto; font-size: 9px; display: grid; place-items: center; color: #fff; font-weight: 700; }

/* ---------------------------------------------------------------- canvas footer pills */

.corner {
  position: absolute; bottom: 14px; z-index: 5;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: var(--r-pill);
  font-size: 12.5px; cursor: pointer; border: 1px solid var(--edge-soft);
  backdrop-filter: blur(18px);
  transition: transform .18s, background .18s;
}
.corner:hover { transform: translateY(-1px); }
#history { left: 16px; background: var(--glass-dark); color: var(--ink); }
#toggle  { left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.86); color: #1a1d21; font-weight: 500; border-color: transparent; }
#toggle:hover { transform: translateX(-50%) translateY(-1px); }

/* ---------------------------------------------------------------- bottom bar: workers + command */

#bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 0 6px; }

#workers { display: flex; align-items: center; gap: 9px; min-width: 0; }
.wk {
  display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto;
  padding: 6px 14px 6px 6px; border-radius: var(--r-pill);
  background: #fff; border: 1px solid #dfe2e5; cursor: pointer;
  font-size: 13px; color: #2a2e33;
  box-shadow: 0 1px 2px rgba(0,0,0,.05);
  transition: transform .2s cubic-bezier(.34,1.4,.5,1), box-shadow .2s;
}
.wk:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.10); }
.wk .face { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.wk.on { background: #16181c; border-color: #16181c; color: #fff; }
.wk .tag { font-size: 10.5px; padding: 2px 7px; border-radius: var(--r-pill); background: rgba(255,255,255,.16); }
.wk.plus { width: 34px; height: 34px; padding: 0; justify-content: center; font-size: 19px; color: #6b7075; }

#center-slot { display: flex; align-items: center; justify-content: center; }
#composer {
  display: flex; align-items: center; gap: 8px; width: 400px;
  padding: 7px 7px 7px 18px; border-radius: var(--r-pill);
  background: #fff; border: 1px solid #dfe2e5; box-shadow: 0 1px 2px rgba(0,0,0,.05);
  transition: box-shadow .22s, border-color .22s;
}
#composer:focus-within { border-color: #b9bfc5; box-shadow: 0 4px 18px rgba(0,0,0,.10); }
#composer input { flex: 1; border: 0; outline: 0; font: 14px var(--font); background: none; color: #16181c; }
#composer input::placeholder { color: #9aa0a6; }
#composer button {
  display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer;
  padding: 8px 15px; border-radius: var(--r-pill); background: #16181c; color: #fff;
  font: 500 13px var(--font);
  transition: transform .18s;
}
#composer button:hover { transform: scale(1.04); }

/* The stop control. The only saturated thing in the product, and it only exists while a worker
   is actually running -- so its presence alone tells you the state from across the room. */
#stop {
  width: 150px; height: 42px; border: 0; border-radius: var(--r-pill); cursor: pointer;
  background: var(--hot); color: #fff; font-size: 15px;
  display: grid; place-items: center;
  box-shadow: 0 6px 20px rgba(255,45,111,.42);
  animation: breathe 2.6s ease-in-out infinite;
  transition: transform .18s;
}
#stop:hover { transform: scale(1.03); }
@keyframes breathe {
  50% { box-shadow: 0 6px 30px rgba(255,45,111,.62); }
}

#meta { display: flex; align-items: center; justify-content: flex-end; gap: 14px; font-size: 12.5px; color: #6b7075; }
#meta .budget { display: inline-flex; align-items: center; gap: 8px; }
#meta .ring { width: 17px; height: 17px; border-radius: 50%; background: conic-gradient(#16181c 0 92%, #dfe2e5 92% 100%); }

/* ---------------------------------------------------------------- motion */

/* Everything on the canvas builds in rather than appearing: the stagger is what makes it read as
   one environment assembling instead of five panels that happened to load. */
.rise { animation: rise .52s cubic-bezier(.16,.84,.44,1) backwards; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes rise {
  from { opacity: 0; transform: translateY(12px) scale(.985); }
}
.msg { animation: rise .42s cubic-bezier(.16,.84,.44,1) backwards; animation-delay: calc(var(--i, 0) * 70ms); }
#side .card { animation: spring .58s cubic-bezier(.22,1.2,.36,1) backwards; animation-delay: calc(120ms + var(--i, 0) * 70ms); }
@keyframes spring {
  from { opacity: 0; transform: translateX(26px) scale(.96); }
}
#dock { animation: drop .5s cubic-bezier(.22,1.2,.36,1) backwards; animation-delay: 60ms; }
@keyframes drop {
  from { opacity: 0; transform: translateX(-50%) translateY(-16px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}

/* ---------------------------------------------------------------- mock-only state switcher */

#states {
  justify-self: center; align-self: center;
  display: flex; gap: 4px; padding: 3px; border-radius: var(--r-pill);
  background: rgba(22,24,28,.86);
}
#states button {
  border: 0; cursor: pointer; padding: 6px 13px; border-radius: var(--r-pill);
  background: none; color: rgba(255,255,255,.6); font: 500 12px var(--font);
}
#states button[aria-pressed="true"] { background: #fff; color: #16181c; }
</style>

<div id="app">
  <div id="states"></div>
  <div id="canvas" data-chat="on">
    <div id="wall"></div>
    <div id="scrim"></div>
    <div id="dock"></div>
    <div id="windows"></div>
    <div id="middle"></div>
    <div id="side"></div>
    <div class="corner" id="history">◷ History</div>
    <div class="corner" id="toggle">Hide chat ⌄</div>
  </div>
  <div id="bar">
    <div id="workers"></div>
    <div id="center-slot"></div>
    <div id="meta">
      <span>Chief · Atera Triage · Diag Room</span>
      <span class="budget">92% Budget <i class="ring"></i></span>
    </div>
  </div>
</div>

<script>
// Hardcoded scenes. Four states, because those are the four a person actually walks up to:
// nothing happening, the worker driving the computer, the worker thinking, and the job done.
const APPS = [
  { name: "Atera",   glyph: "A", bg: "#1a73e8" },
  { name: "Gmail",   glyph: "M", bg: "#d93025" },
  { name: "Sheets",  glyph: "S", bg: "#188038" },
  { name: "Chrome",  glyph: "C", bg: "#4285f4" },
  { name: "Slack",   glyph: "#", bg: "#4a154b" },
  { name: "Linear",  glyph: "L", bg: "#5e6ad2", off: true },
];

const WINDOWS = [
  { name: "Atera — Tickets", tint: "#1a73e8", live: true },
  { name: "Gmail",           tint: "#d93025" },
  { name: "Wind Sheets",     tint: "#188038" },
  { name: "Files",           tint: "#5f6368" },
];

const WORKERS = [
  { name: "Chief of staff",  face: "C", bg: "#3f6f5f" },
  { name: "Atera Triage",    face: "A", bg: "#2f5d86", on: true },
  { name: "Diag Room",       face: "D", bg: "#6b4f7a", tag: "2" },
];

const TICKETS = [
  [44613, "Threat locker request — new install",        "Unassigned", "Open"],
  [44742, "Outlook will not sync after password reset", "Lou",        "Open"],
  [44822, "Augment — device issue (Robert Ruiz)",       "Marcus",     "Pending"],
  [44829, "Printer offline, third floor",               "Unassigned", "Open"],
  [44845, "Jason Brashear — VPN drops every hour",      "Unassigned", "New"],
  [44861, "Invoice mismatch, Titanium Computing LLC",   "Cara",       "Open"],
  [44878, "Licence compliance review",                  "Lou",        "Pending"],
  [44890, "New starter laptop build",                   "Cara",       "Open"],
];

const PLAN = [
  { label: "Sign in to Atera",        badge: "#1a73e8", state: "done" },
  { label: "Extract open tickets",    badge: "#4285f4", state: "done" },
  { label: "Update Wind Sheets log",  badge: "#188038", state: "todo" },
  { label: "Send summary report",     badge: "#d93025", state: "todo" },
];

const SCENES = {
  ready: {
    label: "Idle · ready",
    chat: "on",
    sched: ["Next run in 41 minutes.", "Every hour · weekdays · from 8:00 AM"],
    planNote: "Ø Cost per run: €0.06",
    plan: PLAN.map(s => ({ ...s, state: "todo" })),
    messages: [
      { who: "you",  text: "Keep watching the Atera queue and tell me if anything for Jason Brashear comes in.", when: "8:02 PM" },
      { who: "them", text: "Standing by. I'll check the queue every hour on weekdays and only interrupt you if a ticket has your name on it.", when: "8:02 PM" },
    ],
    running: false,
  },
  operating: {
    label: "Operating the computer",
    chat: "off",
    sched: ["Running now.", "Started 7:28 PM · 2m 14s elapsed"],
    planNote: "Ø Cost per run: €0.06",
    plan: [ { ...PLAN[0], state: "done" }, { ...PLAN[1], state: "now" }, PLAN[2], PLAN[3] ],
    screen: { title: "Atera — Ticket queue · Chrome", hit: 3 },
    running: true,
  },
  thinking: {
    label: "Working in the background",
    chat: "on",
    sched: ["Running now.", "Started 7:28 PM · 4m 06s elapsed"],
    planNote: "Ø Cost per run: €0.06",
    plan: [ { ...PLAN[0], state: "done" }, { ...PLAN[1], state: "done" }, { ...PLAN[2], state: "now" }, PLAN[3] ],
    messages: [
      { who: "you",  text: "Run it now instead of waiting for the schedule.", when: "7:28 PM" },
      { who: "them", text: "Starting the Atera monitoring workflow now. The hourly schedule will re-arm on its own afterwards.", when: "7:28 PM" },
    ],
    thinking: "Comparing 10 open tickets against yesterday's snapshot…",
    running: true,
  },
  done: {
    label: "Workflow completed",
    chat: "on",
    sched: ["Schedule is paused.", "Would run every hour · next 8:39 PM"],
    planNote: "Ø Cost per run: €0.06",
    plan: PLAN.map(s => ({ ...s, state: "done" })),
    report: {
      title: "Workflow completed",
      sub: "Monitored the Atera ticket queue, analysed technician workloads, logged 12 metric rows to Wind Sheets, and sent the summary report to jason@webdevtoday.com.",
      stats: [
        { v: "18:39–18:55 · 16m", k: "Runtime" },
        { v: "€0.68", k: "Total cost" },
      ],
      did: [
        "Signed in to Atera and Gmail.",
        "Categorised 10 active tickets across incoming, open and pending, and calculated technician workloads.",
        "Logged 10 ticket snapshots and 2 workload summary rows into Wind Sheets.",
        "Sent the ticket queue and workload summary report to jason@webdevtoday.com.",
      ],
    },
    messages: [
      { who: "them", text: "Done. Everything above is what I actually did, and the report is already in your inbox.", when: "6:55 PM" },
      { who: "you",  text: "Nice. Same thing tomorrow, but skip the email unless something changed.", when: "6:58 PM" },
    ],
    running: false,
  },
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);

// A painted window thumbnail. In the real build these are live captures of what is open.
const shot = tint => `linear-gradient(160deg, ${tint}22, ${tint}0d), repeating-linear-gradient(#ffffff26 0 3px, transparent 3px 9px), #ffffff1f`;

function paint(key) {
  const s = SCENES[key];
  $("canvas").dataset.chat = s.chat;

  $("dock").innerHTML = APPS.map((a, i) =>
    `<div class="app rise${a.off ? " off" : ""}" style="--i:${i};background:${a.bg}" title="${esc(a.name)}">${a.glyph}</div>`
  ).join("") + `<div class="app add rise" style="--i:${APPS.length}">+</div>`;

  $("windows").innerHTML = WINDOWS.map((w, i) => `
    <div class="win rise${w.live && s.running ? " live" : ""}" style="--i:${i + 1}">
      <div class="bar"><i style="background:${w.tint}"></i>${esc(w.name)}</div>
      <div class="shot" style="background:${shot(w.tint)}"></div>
    </div>`).join("");

  $("side").innerHTML = `
    <div class="card sched" style="--i:0">
      <div class="icon">${s.running ? "❙❙" : "◷"}</div>
      <b>${esc(s.sched[0])}</b><span>${esc(s.sched[1])}</span>
    </div>
    <div class="card plan" style="--i:1">
      <div class="plan-h">${esc(s.planNote)}</div>
      <ul class="steps">${s.plan.map(p => `
        <li class="step ${p.state}">
          <span class="mark">${p.state === "done" ? "✓" : p.state === "now" ? "◜" : ""}</span>
          <span class="label">${esc(p.label)}</span>
          <span class="badge" style="background:${p.badge}"></span>
        </li>`).join("")}</ul>
    </div>`;

  let mid = "";
  if (s.report) {
    mid += `<div id="report">
      <h1 class="rep-h1 rise" style="--i:1">${esc(s.report.title)}</h1>
      <p class="rep-sub rise" style="--i:2">${esc(s.report.sub)}</p>
      <div class="stats">${s.report.stats.map((t, i) =>
        `<div class="stat rise" style="--i:${3 + i}"><b>${esc(t.v)}</b><span>${esc(t.k)}</span></div>`).join("")}</div>
      <h2 class="rep-h2 rise" style="--i:5">What it did</h2>
      <ul class="rep-list rise" style="--i:6">${s.report.did.map(d => `<li>${esc(d)}</li>`).join("")}</ul>
    </div>`;
  }
  if (s.screen) {
    mid += `<div id="doing"><div class="screen rise" style="--i:1">
      <div class="chrome"><i></i><i></i><i></i><span>${esc(s.screen.title)}</span></div>
      <div class="body">
        <div class="row head"><b>Ticket</b><s>Subject</s><u>Technician</u><i>Status</i></div>
        ${TICKETS.map((t, i) =>
          `<div class="row${i === s.screen.hit ? " hit" : ""}"><b>#${t[0]}</b><s>${esc(t[1])}</s><u>${esc(t[2])}</u><i>${esc(t[3])}</i></div>`).join("")}
      </div>
    </div></div>
    <svg class="cursor" viewBox="0 0 12 17"><path d="M0 0l12 11h-6l-2 6z" fill="#fff" stroke="#111" stroke-width="1"/></svg>`;
  }
  if (s.messages) {
    mid += `<div id="chat">${s.messages.map((m, i) =>
      `<div class="msg ${m.who}" style="--i:${i}">${esc(m.text)}<div class="when">${esc(m.when)}</div></div>`).join("")}
      ${s.thinking ? `<div class="thinking"><span class="dots"><i></i><i></i><i></i></span>${esc(s.thinking)}</div>` : ""}
    </div>`;
  }
  $("middle").innerHTML = mid;

  $("workers").innerHTML = `<div class="wk plus">+</div>` + WORKERS.map(w => `
    <div class="wk${w.on ? " on" : ""}">
      <span class="face" style="background:${w.bg}">${w.face}</span>${esc(w.name)}
      ${w.tag ? `<span class="tag">${esc(w.tag)}</span>` : ""}
    </div>`).join("");

  $("center-slot").innerHTML = s.running
    ? `<button id="stop" title="Stop this worker">❙❙</button>`
    : `<div id="composer"><input placeholder="Ask Atera Triage to do something…"><button>Send</button></div>`;

  $("toggle").textContent = s.chat === "on" ? "Hide chat ⌄" : "Show chat ⌃";
}

$("states").innerHTML = Object.entries(SCENES).map(([k, v], i) =>
  `<button data-k="${k}" aria-pressed="${i === 0}">${esc(v.label)}</button>`).join("");
$("states").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  [...$("states").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  paint(b.dataset.k);
};
$("toggle").onclick = () => {
  const c = $("canvas");
  c.dataset.chat = c.dataset.chat === "on" ? "off" : "on";
  $("toggle").textContent = c.dataset.chat === "on" ? "Hide chat ⌄" : "Show chat ⌃";
};

paint("ready");
</script>

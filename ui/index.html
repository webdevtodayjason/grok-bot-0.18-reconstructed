// A worker's surfaces belong under the worker, not in tabs over the conversation. Opening one
// takes the rail: the other cards step aside, its own sections stack beneath it, and clicking
// the card again puts the roster back. The stage stays what it always should have been -- the
// conversation, with a composer that is never in the wrong place.
const SECTIONS = [["persona", "Profile"], ["members", "Members"], ["channels", "Listens on"],
  ["routines", "Workflows"], ["knows", "Knows"]];

function sectionCount(id, agent) {
  if (id === "routines") return String((state.routines ?? []).length || "");
  if (id === "knows") {
    const working = (state.subagents ?? []).filter((x) => subStatus(x.status) === "running").length;
    if (working) return `${working} ●`;
    const n = (state.memories ?? []).length + (state.subagents ?? []).length;
    return n ? String(n) : "";
  }
  if (id === "channels") {
    const live = (state.channels?.connections ?? []).filter((c) => c.isConnected).length;
    return live ? String(live) : "none";
  }
  if (id === "desktop") return "shared";
  if (id === "members") return String((agent.memberIds ?? []).length || "");
  return agent.isGroup ? "group" : "";
}

function renderPersona(agent) {
  const members = (agent.memberIds ?? []).map((id) =>
    state.agents.find((a) => a.id === id)?.name ?? "worker");
  return `<p class="lede">${esc(agent.description || "No job description yet — give this worker a role.")}</p>
    <dl class="kv">
      <dt>Kind</dt><dd>${agent.isGroup ? `Room of ${members.length}` : "Worker"}</dd>
      ${members.length ? `<dt>Members</dt><dd>${esc(members.join(", "))}</dd>` : ""}
      <dt>Answering</dt><dd>${esc(state.model?.model ?? "routed")}</dd>
      <dt>Last active</dt><dd>${ago(agent.lastActivityAt)}</dd>
    </dl>
    <div class="row" style="margin-top:14px">
      ${state.confirmDelete === agent.id
        ? `<button class="btn danger" onclick="removeAgent('${agent.id}')">Really remove ${esc(agent.name)}?</button>
           <button class="btn ghost" onclick="cancelDelete()">Keep</button>`
        : `<button class="btn ghost" onclick="askDelete('${agent.id}')">Remove worker</button>`}
    </div>`;
}

// One container, one X display: every worker draws on the same screen. Saying so beats
// implying each has a private one.
// The iframe is created once and re-parented, never re-created: a fresh element means a fresh
// VNC handshake, which is what made the desktop reconnect on every repaint.
const DESKTOP_URL = "http://127.0.0.1:6080/vnc_lite.html?autoconnect=1&resize=scale&reconnect=1";
let desktopFrame = null;
function mountDesktop() {
  const mount = $("#deskmount");
  if (mount == null) return;
  if (desktopFrame == null) {
    desktopFrame = el("iframe", "deskframe");
    desktopFrame.title = "Box desktop";
    desktopFrame.allow = "clipboard-read; clipboard-write";
    desktopFrame.src = DESKTOP_URL;
  }
  if (desktopFrame.parentElement !== mount) mount.append(desktopFrame);
}
window.popDesktop = () => {
  const frame = desktopFrame;
  if (frame == null) return;
  if (document.fullscreenElement != null) return void document.exitFullscreen();
  frame.requestFullscreen?.().catch(() => alertLine("this browser refused full screen"));
};

// Membership is the group's roster: current members with Remove, and every other individual
// as an Add row. Both write through setGroupMembers with the full new list.
function renderMembers(agent) {
  if (!agent.isGroup) return `<p class="lede">Only a group has members. Cmd-click workers in
    the rail and convene a huddle to make one.</p>`;
  const ids = agent.memberIds ?? [];
  const byId = new Map(state.agents.map((a) => [a.id, a]));
  const rows = ids.map((id) => `<div class="deskrow">
      <div><b>${esc(byId.get(id)?.name ?? id)}</b>
        <div class="sub">${esc(byId.get(id)?.description ?? "")}</div></div>
      ${ids.length > 1 ? `<button class="btn ghost" onclick="dropMember('${agent.id}','${id}')">Remove</button>` : ""}
    </div>`).join("");
  const candidates = state.agents.filter((a) => !a.isGroup && !ids.includes(a.id));
  const adds = candidates.map((a) => `<div class="deskrow">
      <div><b>${esc(a.name)}</b><div class="sub">${esc(a.description ?? "")}</div></div>
      <button class="btn ghost" onclick="addMember('${agent.id}','${a.id}')">Add</button>
    </div>`).join("");
  return `<p class="lede">Who is in this room. Rounds go one member at a time, in order.</p>
    ${rows || '<div class="empty">No members.</div>'}
    ${adds ? `<h2>Add a member</h2>${adds}` : ""}`;
}

const sectionBody = (id, agent) =>
  id === "members" ? renderMembers(agent) :
  id === "persona" ? renderPersona(agent)
  : id === "channels" ? renderChannels(agent)
  : id === "routines" ? renderRoutines(agent)
  : id === "knows" ? renderKnows(agent)
  : renderPersona(agent);

function agentCard(a) {
  const c = el("button", "card");
  c.setAttribute("aria-current", String(a.id === state.selected));
  if (state.picked.has(a.id)) c.classList.add("picked");
  if (a.isRunning) c.classList.add("busy");
  const bar = el("div", "bar");
  bar.append(el("span", "dot" + (a.isRunning ? " on" : "")), el("span", "nm", a.name));
  if (a.unreadCount) bar.append(el("span", "badge", String(a.unreadCount)));
  const body = el("div", "body");
  body.append(el("div", "sub", `${a.isGroup ? "Room · " : ""}${a.isRunning ? "Working" : "Ready"} · ${ago(a.lastActivityAt || a.updatedAt)}`));
  if (a.isGroup) body.append(el("div", "members",
    `${a.memberIds?.length ?? 0} worker${(a.memberIds?.length ?? 0) === 1 ? "" : "s"} in this room`));
  if (a.lastMessagePreview) body.append(el("div", "prev", a.lastMessagePreview));
  else { const sk = el("div", "skel"); sk.append(el("i"), el("i"), el("i")); body.append(sk); }
  c.append(bar, body);
  // Selection is the verb: one is a 1:1, several is a huddle, and the same card again closes
  // the drawer -- so the way out is the way in.
  c.onclick = (event) => {
    if (event.metaKey || event.ctrlKey) {
      state.picked.has(a.id) ? state.picked.delete(a.id) : state.picked.add(a.id);
      render(true);
      return;
    }
    state.picked.clear();
    if (state.selected === a.id) return;
    state.selected = a.id;
    state.section = null;
    state.editor = null;
    state.transcript = null;
    state.channels = state.routines = state.memories = state.subagents = null;
    render(true);
    void refresh();
  };
  return c;
}

function renderRail() {
  const list = $("#rail-list");
  list.innerHTML = "";
  for (const a of state.agents) list.append(agentCard(a));
  if (!state.agents.length) list.append(el("div", "railhead", "no workers yet"));
  const plus = el("button", "card");
  plus.style.cssText = "min-width:120px;width:120px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink-2)";
  plus.textContent = "+";
  plus.title = "New worker";
  plus.onclick = () => window.newAgent();
  list.append(plus);
}

// A huddle is a room, not a gesture: a group is an agent with isGroup and a member list,
// so one convened on Tuesday still holds its history on Friday.
function renderConvene() {
  document.getElementById("convene")?.remove();
  if (state.picked.size < 2) return;
  const bar = el("div");
  bar.id = "convene";
  bar.append(el("span", "n", `${state.picked.size} picked`));
  const huddle = el("button", null, "Huddle");
  huddle.onclick = () => window.huddle();
  const shout = el("button", "ghost", "Broadcast");
  shout.onclick = () => window.broadcast();
  const clear = el("button", "ghost", "Clear");
  clear.onclick = () => { state.picked.clear(); render(); };
  bar.append(huddle, shout, clear);
  document.body.append(bar);
}

const WATCHED = ["agents", "transcript", "subagents", "async-tasks", "tray", "host-settings", "forever-box", "workflows"];

/* ---- routine editor -------------------------------------------------- */
// A routine's trigger is a group of up to 8 members, so "when to run" is a stack you build.
// Each kind below was probed against the live gateway and round-trips unchanged. Warmwind
// also offers Webhook; this host has no receiver for one, so it is absent rather than
// present-and-dead.
const TRIGGER_KINDS = [
  ["cron", "On a schedule", "◷"], ["slack", "Slack message", "◆"], ["github", "Git event", "◐"],
  ["microsoftTeams", "Teams message", "▣"], ["linear", "Linear issue", "◗"],
  ["sentry", "Sentry alert", "▲"], ["pagerduty", "PagerDuty incident", "◈"],
];
const SCHEDULES = [["hourly", "Every hour"], ["daily", "Every day"], ["weekdays", "Weekdays"],
  ["weekly", "Every week"], ["monthly", "Every month"], ["interval", "Interval"], ["advanced", "Advanced…"]];
const DOW = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const UNITS = [["s", "seconds"], ["m", "minutes"], ["h", "hours"], ["d", "days"]];
const GITHUB_EVENTS = [["pr-opened", "Opened"], ["pr-pushed", "Updated"], ["pr-merged", "Merged"],
  ["review-requested", "Review requested"], ["review-approved", "Review approved"],
  ["review-changes-requested", "Changes requested"], ["review-commented", "Review commented"],
  ["pr-comment", "PR comment"], ["inline-review-comment", "Inline review comment"],
  ["review-thread-resolved", "Thread resolved"], ["review-thread-unresolved", "Thread reopened"],
  ["issue-assigned", "Issue assigned"], ["ci-passed", "CI passed"], ["ci-failed", "CI failed"]];
const SLACK_MATCHES = [["message", "New messages"], ["mention", "When @mentioned"],
  ["keyword", "Keyword match"], ["reaction", "A reaction"]];
const LINEAR_EVENTS = [["issueCreated", "Issue created"], ["statusChanged", "Issue status changed"],
  ["endOfCycle", "End of cycle"]];
const SENTRY_EVENTS = [["issueCreated", "Created"], ["issueResolved", "Resolved"], ["issueAssigned", "Assigned"],
  ["issueArchived", "Archived"], ["issueUnresolved", "Unresolved"], ["issueAny", "Any issue event"]];
const PAGERDUTY_EVENTS = [["incidentTriggered", "Triggered"], ["incidentAcknowledged", "Acknowledged"],
  ["incidentResolved", "Resolved"], ["incidentEscalated", "Escalated"], ["incidentAny", "Any incident event"]];
const isCiEvent = (kind) => kind === "ci-passed" || kind === "ci-failed";

function blankTrigger(kind) {
  if (kind === "cron") return { type: "cron", schedule: "0 9 * * *" };
  if (kind === "slack") return { type: "slack", channel: "*", match: { kind: "message" } };
  if (kind === "github") return { type: "github", repo: "", events: ["pr-opened"] };
  if (kind === "microsoftTeams") return { type: "microsoftTeams", tenantId: "", teamId: "", teamIds: [],
    channelIds: [], messageContains: "", messageContainsIsRegex: false, blockUnauthenticatedTeamsUsers: false };
  if (kind === "linear") return { type: "linear", event: { case: "issueCreated" }, projectIds: [], teamIds: [] };
  if (kind === "sentry") return { type: "sentry", event: { case: "issueCreated" }, projectIds: [] };
  return { type: "pagerduty", event: { case: "incidentTriggered" }, serviceIds: [] };
}

// The cron string is the only thing the host stores, so the friendly shapes are read back
// out of it rather than kept beside it — an edit here and an edit in the file agree.
function readSchedule(raw) {
  const s = String(raw ?? "").trim(), base = { hour: 9, min: 0, dow: 1, dom: 1, n: "30", unit: "m", raw: s };
  const every = /^@every\s+(\d+)\s*([smhd])$/i.exec(s);
  if (every) return { ...base, shape: "interval", n: every[1], unit: every[2].toLowerCase() };
  const f = s.split(/\s+/), num = (v) => /^\d{1,2}$/.test(v);
  if (f.length === 5 && num(f[0]) && f[3] === "*") {
    const min = Number(f[0]);
    if (f[1] === "*" && f[2] === "*" && f[4] === "*") return { ...base, shape: "hourly", min };
    if (num(f[1])) {
      const hour = Number(f[1]);
      if (f[2] === "*" && f[4] === "*") return { ...base, shape: "daily", min, hour };
      if (f[2] === "*" && f[4] === "1-5") return { ...base, shape: "weekdays", min, hour };
      if (f[2] === "*" && num(f[4])) return { ...base, shape: "weekly", min, hour, dow: Number(f[4]) % 7 };
      if (num(f[2]) && f[4] === "*") return { ...base, shape: "monthly", min, hour, dom: Number(f[2]) };
    }
  }
  return { ...base, shape: "advanced" };
}
function buildSchedule(v) {
  if (v.shape === "hourly") return `${v.min} * * * *`;
  if (v.shape === "daily") return `${v.min} ${v.hour} * * *`;
  if (v.shape === "weekdays") return `${v.min} ${v.hour} * * 1-5`;
  if (v.shape === "weekly") return `${v.min} ${v.hour} * * ${v.dow}`;
  if (v.shape === "monthly") return `${v.min} ${v.hour} ${v.dom} * *`;
  if (v.shape === "interval") return `@every ${v.n}${v.unit}`;
  return v.raw;
}

// The host drops a malformed trigger member silently — the routine saves with one fewer
// listener and nothing says so. Catching it here is the difference between a typo and a
// routine that quietly never fires.
function triggerProblem(t) {
  if (t.type === "cron") {
    const s = String(t.schedule ?? "").trim();
    if (!s) return "needs a schedule";
    if (!/^@every\s+\d+\s*[smhd]$/i.test(s) && s.split(/\s+/).length !== 5) return "not a cron expression";
    return null;
  }
  if (t.type === "github") {
    if (!/^[^\s/]+\/[^\s/]+$/.test(String(t.repo).trim())) return "needs owner/repo";
    if (!t.events.length) return "pick an event";
    if (t.events.some(isCiEvent) && !String(t.ciBranch ?? "").trim()) return "CI events need a branch";
    return null;
  }
  if (t.type === "slack") {
    if (!String(t.channel).trim()) return "needs a channel, or * for anywhere";
    if (t.match.kind === "keyword" && !String(t.match.keyword ?? "").trim()) return "needs a keyword";
    return null;
  }
  if (t.type === "microsoftTeams") {
    if (!String(t.tenantId).trim()) return "needs a tenant id";
    if (!String(t.teamId).trim()) return "needs a team id";
  }
  return null;
}

const idList = (v) => String(v).split(/[,\s]+/).filter(Boolean);
function applyTrig(t, key, val) {
  if (key.startsWith("cron.")) {
    const f = key.slice(5);
    // The Advanced box IS the schedule. Routing it through readSchedule/buildSchedule threw
    // the typing away whenever the old value still parsed as one of the drawn shapes.
    if (f === "raw") { t.schedule = val; return; }
    const v = readSchedule(t.schedule);
    if (f === "time") { const [h, m] = String(val).split(":"); v.hour = Number(h) || 0; v.min = Number(m) || 0; }
    else if (f === "shape" || f === "n" || f === "unit") v[f] = val;
    else v[f] = Number(val);
    t.schedule = buildSchedule(v);
    return;
  }
  if (key === "match") t.match = val === "keyword" ? { kind: "keyword", keyword: "" } : { kind: val };
  else if (key === "keyword") t.match = { kind: "keyword", keyword: val };
  else if (key === "event") t.event = val === "statusChanged" ? { case: val, statusIds: [] }
    : val === "endOfCycle" ? { case: val, cycleIds: [] } : { case: val };
  else if (key === "events") t.events = [val];
  else if (key === "ids") t[t.type === "pagerduty" ? "serviceIds" : "projectIds"] = idList(val);
  else if (key === "teamIds") t.teamIds = idList(val);
  else if (key === "userAllowlist") {
    const users = idList(val);
    if (users.length) t.userAllowlist = users; else delete t.userAllowlist;
  } else t[key] = val;
}

function trigRow(t, i) {
  const sel = (key, opts, cur) => `<select onchange="trigPick(${i},'${key}',this.value)">` +
    opts.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(cur) ? " selected" : ""}>${esc(l)}</option>`)
      .join("") + "</select>";
  const txt = (key, cur, ph, cls = "") =>
    `<input class="${cls}" value="${esc(cur ?? "")}" placeholder="${esc(ph)}" oninput="trigSet(${i},'${key}',this.value)">`;
  const lbl = (s) => `<span class="lbl">${s}</span>`;

  if (t.type === "cron") {
    const v = readSchedule(t.schedule);
    const time = `<input type="time" value="${String(v.hour).padStart(2, "0")}:${String(v.min).padStart(2, "0")}"
      onchange="trigSet(${i},'cron.time',this.value)">`;
    const num = (f, val, min, max) => `<input class="num" type="number" min="${min}" max="${max}" value="${val}"
      onchange="trigSet(${i},'cron.${f}',this.value)">`;
    const body =
      v.shape === "hourly" ? `${lbl("at minute")}${num("min", v.min, 0, 59)}`
      : v.shape === "weekly" ? `${lbl("on")}${sel("cron.dow", DOW.map((d, n) => [n, d]), v.dow)}${lbl("at")}${time}`
      : v.shape === "monthly" ? `${lbl("on day")}${num("dom", v.dom, 1, 31)}${lbl("at")}${time}`
      : v.shape === "interval" ? `${lbl("every")}<input class="num" type="number" min="1" value="${esc(v.n)}"
          oninput="trigSet(${i},'cron.n',this.value)">${sel("cron.unit", UNITS, v.unit)}`
      : v.shape === "advanced" ? txt("cron.raw", t.schedule, "0 9 * * 1-5", "wide")
      : `${lbl("at")}${time}`;
    return sel("cron.shape", SCHEDULES, v.shape) + body;
  }
  if (t.type === "slack") {
    return sel("match", SLACK_MATCHES, t.match.kind) + lbl("in") + txt("channel", t.channel, "#channel or *") +
      (t.match.kind === "keyword" ? lbl("containing") + txt("keyword", t.match.keyword, "Any text") : "");
  }
  if (t.type === "github") {
    return sel("events", GITHUB_EVENTS, t.events[0]) + lbl("in") + txt("repo", t.repo, "owner/repo", "wide") +
      (t.events.some(isCiEvent) ? lbl("on") + txt("ciBranch", t.ciBranch, "branch") : "") +
      lbl("from") + txt("userAllowlist", (t.userAllowlist ?? []).join(", "), "Anyone");
  }
  if (t.type === "microsoftTeams") {
    return lbl("tenant") + txt("tenantId", t.tenantId, "tenant id") + lbl("team") + txt("teamId", t.teamId, "team id") +
      lbl("containing") + txt("messageContains", t.messageContains, "Any text");
  }
  if (t.type === "linear") {
    return sel("event", LINEAR_EVENTS, t.event.case) + lbl("in") + txt("ids", t.projectIds.join(", "), "All projects") +
      lbl("for") + txt("teamIds", t.teamIds.join(", "), "All teams");
  }
  if (t.type === "sentry") {
    return sel("event", SENTRY_EVENTS, t.event.case) + lbl("in") + txt("ids", t.projectIds.join(", "), "All projects");
  }
  return sel("event", PAGERDUTY_EVENTS, t.event.case) + lbl("in") + txt("ids", t.serviceIds.join(", "), "All services");
}

// Which of those kinds this box can actually deliver. The host builds exactly two event sources
// (createBackendRelaySources: one Slack, one GitHub), hands its trigger hub those two and nothing
// else, and both were polled out of a relay this product no longer has, so this box does not
// have. So the other four have no source here at all, and those two only work while the host
// reports that listener connected. Offering them anyway sells a routine that saves, shows a
// countdown of nothing, and never fires -- the same reason Webhook is absent above.
const RELAY_SOURCED_TRIGGERS = ["slack", "github"];
const TRIGGER_PLATFORM_NAMES = { slack: "Slack", github: "GitHub", microsoftTeams: "Teams",
  linear: "Linear", sentry: "Sentry", pagerduty: "PagerDuty" };
function triggerUnavailable(kind) {
  if (kind === "cron") return null;
  const platform = TRIGGER_PLATFORM_NAMES[kind] ?? kind;
  if (!RELAY_SOURCED_TRIGGERS.includes(kind))
    return `Nothing delivers ${platform} events to this workspace yet.`;
  const raw = state.integrations;
  const list = Array.isArray(raw) ? raw : Array.isArray(raw?.integrations) ? raw.integrations
    : Array.isArray(raw?.platforms) ? raw.platforms : Array.isArray(raw?.connections) ? raw.connections : [];
  const row = list.find((entry) => entry.platform === kind || entry.id === kind) ?? null;
  if (row && (row.isConnected ?? row.connected)) return null;
  return `${platform} events are not wired into this workspace yet (${row ? `the ${platform} listener is not connected` : `there is no ${platform} listener`}).`;
}

function trigMenu() {
  const open = state.editor.menu === "schedule";
  const rest = TRIGGER_KINDS.slice(1).map(([k, l, m]) => {
    const why = triggerUnavailable(k);
    return why
      ? `<button disabled title="${esc(why)}"><span class="mark">${m}</span>${l} · no listener on this box</button>`
      : `<button onclick="addTrigger('${k}')"><span class="mark">${m}</span>${l}</button>`;
  }).join("");
  const blocked = TRIGGER_KINDS.slice(1).filter(([k]) => triggerUnavailable(k) != null);
  const note = blocked.length
    ? `<div class="why">${esc(`${blocked.length} event trigger${blocked.length === 1 ? "" : "s"} need a listener this box has not connected, so ${blocked.length === 1 ? "it is" : "they are"} listed and cannot be picked. ${triggerUnavailable(blocked[0][0])} A schedule is run by the box itself and always works.`)}</div>`
    : "";
  const sub = open
    ? `<div class="sub2">${SCHEDULES.map(([s, l]) => `<button onclick="addSchedule('${s}')">${l}</button>`).join("")}</div>`
    : "";
  return `<div class="trigmenu">
    <button aria-expanded="${open}" onclick="openScheduleMenu()">
      <span class="mark">◷</span>On a schedule<span class="more">${open ? "▾" : "›"}</span></button>
    ${sub}${rest}${note}</div>`;
}

function editorHtml() {
  const e = state.editor;
  const rows = e.triggers.map((t, i) => {
    const mark = TRIGGER_KINDS.find(([k]) => k === t.type)?.[2] ?? "•";
    const why = e.problems?.[i];
    return `<div class="trig${why ? " bad" : ""}"><span class="mark">${mark}</span>${trigRow(t, i)}
      <button class="x" title="Remove" onclick="dropTrigger(${i})">×</button>
      ${why ? `<div class="why">${esc(why)}</div>` : ""}</div>`;
  }).join("");
  return `<h4>Name</h4>
    <input value="${esc(e.name)}" placeholder="Nightly ticket sweep" oninput="editSet('name',this.value)">
    <h4>What it should do each run</h4>
    <textarea rows="3" placeholder="Sweep open tickets and summarise anything untouched for 48h"
      oninput="editSet('prompt',this.value)">${esc(e.prompt)}</textarea>
    <h4>When to run</h4>
    <div class="trigstack">${rows}
      <div class="addtrig">
        <button onclick="toggleTrigMenu()">＋ ${e.triggers.length ? "Add another" : "Add trigger"}</button>
        ${e.menu ? trigMenu() : ""}
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn" onclick="saveRoutine()">${e.automationId ? "Save changes" : "Create routine"}</button>
      <button class="btn ghost" onclick="closeRoutine()">Cancel</button>
      ${e.error ? `<span class="sub" style="color:#b3113a">${esc(e.error)}</span>` : ""}
    </div>`;
}
// The editor owns its own subtree: re-rendering only this keeps focus in a half-typed field.
function renderEditor() {
  const host = $("#editor");
  if (host != null) host.innerHTML = editorHtml();
}

const triggerMembers = (t) => t == null ? []
  : t.type === "group" ? t.listeners.map((m) => JSON.parse(JSON.stringify(m)))
  : [JSON.parse(JSON.stringify(t))];

window.openRoutine = (agentId, automationId) => {
  const r = (state.routines ?? []).find((x) => x.id === automationId);
  state.editor = { agentId, automationId: automationId ?? null, name: r?.name ?? "", prompt: r?.prompt ?? "",
    isEnabled: r?.isEnabled ?? true, triggers: triggerMembers(r?.trigger), menu: null, problems: null, error: null };
  render(true);
};
window.closeRoutine = () => { state.editor = null; render(true); };
window.editSet = (key, value) => { state.editor[key] = value; };
window.trigSet = (i, key, value) => applyTrig(state.editor.triggers[i], key, value);
window.trigPick = (i, key, value) => { applyTrig(state.editor.triggers[i], key, value); renderEditor(); };
window.dropTrigger = (i) => { state.editor.triggers.splice(i, 1); state.editor.problems = null; renderEditor(); };
window.toggleTrigMenu = () => { state.editor.menu = state.editor.menu ? null : "root"; renderEditor(); };
window.openScheduleMenu = () => {
  state.editor.menu = state.editor.menu === "schedule" ? "root" : "schedule";
  renderEditor();
};
window.addTrigger = (kind) => pushTrigger(blankTrigger(kind));
window.addSchedule = (shape) => pushTrigger({ type: "cron", schedule: buildSchedule({ ...readSchedule("0 9 * * *"), shape }) });
function pushTrigger(trigger) {
  const e = state.editor;
  e.menu = null;
  // TRIGGER_MAX_GROUP_LISTENERS: the host keeps the first 8 and drops the rest without a word.
  if (e.triggers.length >= 8) e.error = "eight triggers is the host's limit";
  else e.triggers.push(trigger);
  renderEditor();
}
window.saveRoutine = () => {
  const e = state.editor;
  e.problems = e.triggers.map(triggerProblem);
  e.error = !e.name.trim() ? "name it"
    : !e.prompt.trim() ? "say what it should do"
    : !e.triggers.length ? "add at least one trigger"
    : e.problems.some(Boolean) ? "fix the flagged triggers" : null;
  if (e.error) return renderEditor();
  const trigger = e.triggers.length === 1 ? e.triggers[0] : { type: "group", listeners: e.triggers };
  const spec = { name: e.name.trim(), prompt: e.prompt.trim(), trigger, isEnabled: e.isEnabled };
  const { agentId, automationId } = e;
  guard(async () => {
    await (automationId
      ? call("updateAgentAutomation", { id: agentId, automationId, spec })
      : call("createAgentAutomation", { id: agentId, spec }));
    state.editor = null;
  });
};

/* ---- actions -------------------------------------------------------- */
async function guard(fn) {
  try { await fn(); await refresh(); }
  catch (e) { alertLine(e.message); }
}
function alertLine(msg) {
  let t = $("#toast");
  if (t == null) {
    t = el("div"); t.id = "toast";
    t.style.cssText = "position:fixed;left:50%;bottom:178px;transform:translateX(-50%);" +
      "background:rgba(23,29,33,.92);color:#e9edf0;border:1px solid rgba(255,255,255,.12);" +
      "padding:10px 18px;border-radius:999px;font-size:13px;z-index:70;backdrop-filter:blur(18px)";
    document.body.append(t);
  }
  t.textContent = msg; t.hidden = false;
  clearTimeout(alertLine._t);
  alertLine._t = setTimeout(() => { t.hidden = true; }, 6000);
}
// ponytail: no prompt()/confirm() — native dialogs block the page and look nothing
// like the rest of this. Inline form + two-click delete instead.
window.newAgent = () => { state.creating = true; state.view = "agents"; render(); };
window.cancelCreate = () => { state.creating = false; render(); };
window.createWorker = (kickstart) => {
  const name = $("#nw-name")?.value?.trim();
  if (!name) { alertLine("a worker needs a name"); return; }
  const description = $("#nw-desc")?.value?.trim() ?? "";
  guard(async () => {
    // createAgent answers {agent:{…}}, not a bare agent.
    const made = await call("createAgent", { name, description, origin: "user", isKickstartRequested: kickstart });
    const id = made?.agent?.id ?? made?.id;
    state.creating = false;
    if (id) { state.selected = id; state.view = "agents"; }
  });
};
window.sendPrompt = (id) => {
  const box = $("#prompt");
  const text = box?.value?.trim();
  if (!text) return;
  // Clear before the round trip: the draft is carried across repaints on purpose, so
  // without this your message stays in the box after it has already been sent.
  if (box) box.value = "";
  state.draft = "";
  guard(() => call("sendPrompt", { agentId: id, prompt: text }));
};
window.kickstart = (id) => guard(() => call("kickstartAgent", { id }));
window.huddle = () => {
  const members = [...state.picked];
  const names = state.agents.filter(a => members.includes(a.id)).map(a => a.name);
  const name = prompt(`Name this huddle (${names.join(", ")})`, names.slice(0, 2).join(" + "));
  if (!name) return;
  guard(async () => {
    const made = await call("createGroup", { name, description: "", memberAgentIds: members });
    state.picked.clear();
    const id = made?.agent?.id ?? made?.id;
    if (id) { state.selected = id; state.view = "agents"; }
  });
};
window.broadcast = () => {
  const message = prompt(`Broadcast to ${state.picked.size} workers`);
  if (!message?.trim()) return;
  guard(async () => {
    await call("broadcastToAgents", { targets: [...state.picked], message });
    state.picked.clear();
  });
};

// Channels. The token never touches this page: the host hands back the platform's own
// authorisation URL, the human approves there, and the channel binds on the host side.
window.linkChannel = (id, platform) => guard(async () => {
  const answer = await call("getListenerConnectUrl", { platform });
  const url = answer?.url;
  if (!url) { alertLine(`${platform} returned no connect url`); return; }
  window.open(url, "_blank", "noopener");
  alertLine(`approve ${platform} in the tab that opened, then refresh`);
});
window.unlinkChannel = (id, platform) => guard(() => call("disconnectChannel", { id, platform }));

// Routines. The editor below builds the trigger stack; see renderEditor.
window.runRoutine = (id, automationId) => guard(() => call("runAgentAutomationNow", { id, automationId }));
window.toggleRoutine = (id, automationId, isEnabled) =>
  guard(() => call("setAgentAutomationEnabled", { id, automationId, isEnabled }));
window.dropRoutine = (id, automationId) => {
  if (!confirmOnce(`drop-${automationId}`)) return;
  guard(() => call("deleteAgentAutomation", { id, automationId }));
};

// Memory
// Host settings are a flat patch; two of them live one level down.
window.setSetting = (key, value) => guard(() => call("setHostSettings",
  key === "autoReviewEnabled"
    ? { autoReviewInstructions: { ...(state.settings?.autoReviewInstructions ?? {}), isEnabled: value } }
  : key === "notificationsEnabled"
    ? { notifications: { ...(state.settings?.notifications ?? {}), isEnabled: value } }
  : { [key]: value }));

window.reloadEndpoints = () => guard(async () => {
  state.endpoints = await (await fetch("/endpoints")).json();
});
window.adoptSubscription = (id) => guard(async () => {
  const apiKey = document.getElementById(`subkey-${id}`)?.value?.trim() || undefined;
  const model = document.getElementById(`submodel-${id}`)?.value?.trim() || undefined;
  const res = await fetch("/subscriptions/adopt", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, apiKey, model }) });
  const body = await res.json();
  if (!res.ok) throw new Error(body?.error ?? "could not adopt");
  alertLine(`adopted ${id}: endpoint ${body.endpoint.name} (${body.endpoint.model})`);
  state.endpoints = await (await fetch("/endpoints")).json();
  state.subscriptions = (await (await fetch("/subscriptions")).json()).subscriptions;
});
window.forgetSubscription = (id) => guard(async () => {
  const res = await fetch("/subscriptions/forget", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id }) });
  if (!res.ok) throw new Error("could not forget");
  state.endpoints = await (await fetch("/endpoints")).json();
  state.subscriptions = (await (await fetch("/subscriptions")).json()).subscriptions;
});
window.useEndpoint = (id) => guard(async () => {
  const res = await fetch("/endpoints/use", { method: "POST",
    headers: { "content-type": "application/json" }, body: JSON.stringify({ id }) });
  const body = await res.json();
  if (!res.ok) throw new Error(body?.error ?? "could not switch");
  alertLine(`now answering with ${body.using} — takes effect on the next message`);
  state.endpoints = await (await fetch("/endpoints")).json();
});

window.addMember = (groupId, agentId) => guard(async () => {
  const group = state.agents.find((a) => a.id === groupId);
  await call("setGroupMembers", { id: groupId, memberAgentIds: [...(group?.memberIds ?? []), agentId] });
});
window.dropMember = (groupId, agentId) => guard(async () => {
  const group = state.agents.find((a) => a.id === groupId);
  await call("setGroupMembers", { id: groupId,
    memberAgentIds: (group?.memberIds ?? []).filter((x) => x !== agentId) });
});

window.forget = (id, memoryId) => guard(() => call("deleteAgentMemory", { id, memoryId }));
window.forgetAll = (id) => {
  if (!confirmOnce(`forget-${id}`)) return;
  guard(() => call("clearAgentMemories", { id }));
};

// One-shot confirm without a blocking dialog: the second click inside 4s commits.
const pendingConfirm = new Map();
function confirmOnce(key) {
  const now = performance.now();
  const armed = pendingConfirm.get(key);
  if (armed != null && now - armed < 4000) { pendingConfirm.delete(key); return true; }
  pendingConfirm.set(key, now);
  alertLine("click again to confirm");
  return false;
}

window.toggleTalk = () => { state.talkOpen = !state.talkOpen; render(); };
window.askDelete = (id) => { state.confirmDelete = id; render(); };
window.cancelDelete = () => { state.confirmDelete = null; render(); };
window.removeAgent = (id) => {
  guard(async () => {
    await call("deleteAgent", { id });
    state.selected = null; state.confirmDelete = null;
  });
};

/* ---- SSE ------------------------------------------------------------ */
function connect() {
  const src = new EventSource("/events");
  src.onopen = () => { state.live = true; };
  src.onerror = () => { state.live = false; };
  src.onmessage = (ev) => {
    let payload; try { payload = JSON.parse(ev.data); } catch { return; }
    const channel = payload.channel ?? "unknown";
    state.eventCounts.set(channel, (state.eventCounts.get(channel) ?? 0) + 1);
    const body = payload.payload;
    state.events.unshift({
      channel,
      summary: body == null ? "null" : typeof body === "object" ? JSON.stringify(body).slice(0, 180) : String(body),
      at: new Date().toLocaleTimeString(),
    });
    state.events.length = Math.min(state.events.length, 200);
    if (["agents", "agent-upserted", "tray", "async-tasks", "host-settings", "forever-box"].includes(channel)) {
      clearTimeout(connect.t);
      connect.t = setTimeout(() => refresh().catch(() => {}), 320);
    } else render();
  };
}

/* ---- boot ----------------------------------------------------------- */
$("#command-send").onclick = () => { if (state.selected) sendPrompt(state.selected); };
$("#prompt").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && state.selected) {
    event.preventDefault(); sendPrompt(state.selected);
  }
});

refresh()
  .then(connect)
  .catch((e) => { $("#stage").innerHTML = `<div class="panel"><h1>Something broke</h1>
    <p class="lede">${esc(e.message)}</p>
    <p class="lede">Is the box running? <code>docker ps --filter name=grok-bot-local-vm</code></p></div>`; });
setInterval(() => refresh().catch(() => {}), 15000);

// The label escalates while a run is in flight, and resets the moment it settles.
setInterval(() => {
  const busy = state.agents.some((agent) => agent.id === state.selected && agent.isRunning);
  if (!busy) { if (state.waitTick !== 0 || state.thinking) { state.waitTick = 0; state.thinking = ""; render(); } return; }
  if (state.waitTick < 2) { state.waitTick += 1; render(); }
}, 9000);
</script>
</body>
